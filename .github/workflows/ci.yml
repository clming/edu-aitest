name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FLUTTER_VERSION: '3.16.0'
  GO_VERSION: '1.21'

jobs:
  # Flutter 测试和构建
  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-app
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      
      - name: 获取依赖
        run: flutter pub get
      
      - name: 代码分析
        run: flutter analyze
      
      - name: 运行测试
        run: flutter test
      
      - name: 构建 Web
        run: flutter build web --release

  # Go 后端测试和构建
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-backend
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edu_assistant_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: 安装依赖
        run: go mod download
      
      - name: 生成 Swagger
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g cmd/main.go -o ./docs
      
      - name: 运行测试
        run: go test -v ./... -cover
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/edu_assistant_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
      
      - name: 构建
        run: go build -o edu-assistant cmd/main.go

  # Docker 构建
  docker-build:
    runs-on: ubuntu-latest
    needs: [flutter-test, go-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      # 构建后端镜像
      - name: 构建后端 Docker 镜像
        run: |
          cd go-backend
          docker build -t edu-assistant-backend:${{ github.sha }} .
      
      # 构建前端镜像
      - name: 构建前端 Docker 镜像
        run: |
          cd flutter-app
          docker build -t edu-assistant-web:${{ github.sha }} .
      
      # 推送到 Docker Hub（需要配置 secrets）
      - name: 登录 Docker Hub
        if: false  # 暂时禁用，需要配置 Docker Hub 账号
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: 推送后端镜像
        if: false
        run: |
          docker push edu-assistant-backend:${{ github.sha }}
      
      - name: 推送前端镜像
        if: false
        run: |
          docker push edu-assistant-web:${{ github.sha }}

  # 部署（示例）
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: false  # 暂时禁用
    
    steps:
      - name: 部署到服务器
        run: |
          echo "部署步骤待配置"
