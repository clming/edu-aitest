name: edu_assistant
description: 教育类应用 - iOS + Android + Web 三端合一
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # 路由
  go_router: ^13.0.0
  
  # 网络请求
  dio: ^5.4.0
  
  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # 持久化存储
  shared_preferences: ^2.2.2
  
  # UI 组件
  cupertino_icons: ^1.0.6
  
  # 图片处理
  image_picker: ^1.0.4
  
  # 工具
  intl: ^0.18.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  
  # 图标生成
  flutter_launcher_icons: ^0.13.1
  
  # 启动屏生成
  flutter_native_splash: ^2.3.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#667eea"
    theme_color: "#667eea"

flutter_native_splash:
  color: "#667eea"
  color_dark: "#764ba2"
  image: "assets/icons/splash_icon.png"
  image_dark: "assets/icons/splash_icon_dark.png"
  android: true
  ios: true
  web: true
  fullscreen: true

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
